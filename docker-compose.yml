services:
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: statcast-pubsub
    command: gcloud beta emulators pubsub start --project=${GCP_PROJECT_ID:-local-statcast-project} --host-port=0.0.0.0:8085
    ports:
      - "${PUBSUB_PORT:-8085}:8085"
    environment:
      - PUBSUB_PROJECT_ID=${GCP_PROJECT_ID:-local-statcast-project}
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -f http://localhost:8085 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: statcast-pubsub-init
    depends_on:
      pubsub:
        condition: service_healthy
    environment:
      - PUBSUB_HOST=pubsub
      - PUBSUB_PORT=8085
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-local-statcast-project}
      - PUBSUB_TOPIC_STATCAST_RAW=${PUBSUB_TOPIC_STATCAST_RAW:-statcast-raw-ingested}
      - PUBSUB_SUBSCRIPTION_STATCAST_RAW=${PUBSUB_SUBSCRIPTION_STATCAST_RAW:-statcast-raw-ingested-sub}
      - PUBSUB_TOPIC_LIVE_EVENTS=${PUBSUB_TOPIC_LIVE_EVENTS:-mlb-live-events}
      - PUBSUB_SUBSCRIPTION_LIVE_EVENTS=${PUBSUB_SUBSCRIPTION_LIVE_EVENTS:-mlb-live-events-sub}
    volumes:
      - ./docker/pubsub/init-topics.sh:/init-topics.sh:ro
    entrypoint: [ "/bin/bash", "/init-topics.sh" ]
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: statcast-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-statcast}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-statcast}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-statcast_pass}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: statcast-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-statcast}
      - POSTGRES_USER=${POSTGRES_USER:-statcast}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-statcast_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statcast} -d ${POSTGRES_DB:-statcast}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: statcast-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s


  ingestion:
    build:
      context: ./apps/ingestion
      dockerfile: Dockerfile
    container_name: statcast-ingestion
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_HTTP_PORT=8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-statcast}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-statcast}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-statcast_pass}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-statcast}
      - POSTGRES_USER=${POSTGRES_USER:-statcast}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-statcast_pass}
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-local-statcast-project}
      - PUBSUB_TOPIC_STATCAST_RAW=${PUBSUB_TOPIC_STATCAST_RAW:-statcast-raw-ingested}

  aggregation:
    build:
      context: ./apps/aggregation
      dockerfile: Dockerfile
    container_name: statcast-aggregation
    command: [ "--worker" ]
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pubsub:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_HTTP_PORT=8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-statcast}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-statcast}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-statcast_pass}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-statcast}
      - POSTGRES_USER=${POSTGRES_USER:-statcast}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-statcast_pass}
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-local-statcast-project}
      - PUBSUB_TOPIC_STATCAST_RAW=${PUBSUB_TOPIC_STATCAST_RAW:-statcast-raw-ingested}
      - PUBSUB_SUBSCRIPTION_STATCAST_RAW=${PUBSUB_SUBSCRIPTION_STATCAST_RAW:-statcast-raw-ingested-sub}

  live-worker:
    build:
      context: ./apps/live-worker
      dockerfile: Dockerfile
    container_name: statcast-live-worker
    depends_on:
      postgres:
        condition: service_healthy
      pubsub:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-statcast}
      - POSTGRES_USER=${POSTGRES_USER:-statcast}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-statcast_pass}
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-local-statcast-project}
      - PUBSUB_TOPIC_LIVE_EVENTS=${PUBSUB_TOPIC_LIVE_EVENTS:-mlb-live-events}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-10.0}
      - TARGET_GAME_PKS=${TARGET_GAME_PKS:-}

  live-api:
    build:
      context: ./apps/live-api
      dockerfile: Dockerfile
    container_name: statcast-live-api
    ports:
      - "${LIVE_API_PORT:-8001}:8001"
    depends_on:
      pubsub:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-local-statcast-project}
      - PUBSUB_SUBSCRIPTION_LIVE_EVENTS=${PUBSUB_SUBSCRIPTION_LIVE_EVENTS:-mlb-live-events-sub}
      - KEEPALIVE_INTERVAL_MS=${KEEPALIVE_INTERVAL_MS:-15000}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}

  trigger-api:
    build:
      context: ./apps/trigger-api
      dockerfile: Dockerfile
    container_name: statcast-trigger-api
    ports:
      - "${TRIGGER_API_PORT:-8000}:8000"
    depends_on:
      pubsub:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-local-statcast-project}
      - PUBSUB_TOPIC_STATCAST_RAW=${PUBSUB_TOPIC_STATCAST_RAW:-statcast-raw-ingested}

  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    container_name: statcast-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-statcast}
      - POSTGRES_USER=${POSTGRES_USER:-statcast}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-statcast_pass}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
  article-generator:
    build:
      context: ./apps/article-generator
      dockerfile: Dockerfile
    container_name: statcast-article-generator
    depends_on:
      clickhouse:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_HTTP_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-statcast}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-statcast_pass}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-statcast}
      - QDRANT_HOST=qdrant
      - QDRANT_HTTP_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    volumes:
      - ./apps/article-generator/src:/app/src

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: statcast-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-statcast}
      - POSTGRES_USER=${POSTGRES_USER:-statcast}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-statcast_pass}
      - NEXT_PUBLIC_LIVE_API_URL=${NEXT_PUBLIC_LIVE_API_URL:-http://localhost:8001}

volumes:
  clickhouse_data:
  postgres_data:
  qdrant_data:

