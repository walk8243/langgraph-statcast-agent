[project]
name = "statcast-aggregation"
version = "0.1.0"
description = "ClickHouse to PostgreSQL Statcast Aggregation Service"
requires-python = ">=3.10"
dependencies = [
    "clickhouse-connect>=0.7.0",
    "fastapi>=0.100.0",
    "google-cloud-pubsub>=2.18.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.25.0",
    "pytest>=8.0.0",
]

[project.scripts]
statcast-aggregation = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

